# The radio state every round ends in (rig_requires.py baseline), whatever the opening state was.
# A round that needs a radio off says so in its rig-requires block; nothing carries an off radio forward.
# operator= names radios only the operator can bring back on (D-HU's WiFi re-join needs a tap), so
# rig_requires.py order counts them as an operator action and check --fix never switches them on.
D-HU    wifi=on bt=on operator=wifi
D-POCO  wifi=on bt=on
D-MOTO  wifi=on bt=on
D-HP    wifi=on bt=on
D-SAM   wifi=on bt=on
